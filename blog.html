<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" type="text/css" href="text/css_sitewide.css">
  <link rel="stylesheet" type="text/css" href="text/css_blog.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barriecito&family=Barrio&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <script src="scripts/js.js"></script>
  <title>The GADH: Blog</title>
</head>

<body>
  <!-- NAVBAR -->
  <header>
    <script src="site-navbar.js"></script>
    <site-navbar id="main-navbar"></site-navbar>
  </header>

  <!-- PAGE HEADER -->
  <div class="blog-header">
    <span class="section-label">Community Voice</span>
    <h1>News &amp; Updates</h1>
    <p>Perspectives, data briefings, and advocacy updates from across the Global Fund community.</p>
  </div>

  <!-- MAIN CONTAINER WITH SIDEBAR -->
  <div class="blog-container">
    
    <!-- SIDEBAR WITH FILTERS -->
    <aside class="filter-sidebar" id="filter-sidebar">
      <div class="search-box">
        <input type="text" id="search-input" class="search-input" placeholder="Search posts...">
      </div>
      <button class="sidebar-toggle" id="sidebar-toggle">
        <h2 class="sidebar-title">Topics</h2>
        <span class="toggle-arrow">▼</span>
      </button>
      <div class="filter-bar" id="filter-bar" style="display: none;">
        <!-- Checkboxes are injected here dynamically -->
      </div>

        <button class="sidebar-toggle" id="year-sidebar-toggle">
          <h2 class="sidebar-title">Year</h2>
          <span class="toggle-arrow">▼</span>
        </button>
        <div class="filter-bar" id="year-filter-bar" style="display: none;">
          <!-- Year checkboxes injected here -->
        </div>

        <button class="sidebar-toggle" id="author-sidebar-toggle">
          <h2 class="sidebar-title">Author</h2>
          <span class="toggle-arrow">▼</span>
        </button>
        <div class="filter-bar" id="author-filter-bar" style="display: none;">
          <!-- Author checkboxes injected here -->
        </div>
    </aside>

    <!-- MAIN CONTENT -->

    <main class="blog-main">
      <div id="posts-count" class="posts-count">
        Displaying <span id="count-displayed">0</span> of <span id="count-total">0</span>
      </div>

      <div id="active-filters-display" class="active-filters-display">
        <!-- Active filter tags injected here -->
      </div>

      <div class="posts-grid" id="posts-grid">
        <!-- Posts injected here -->
      </div>
    </main>

  </div>

  <!-- FOOTER -->
  <script src="site-footer.js"></script>
  <site-footer></site-footer>

<script src="scripts/posts-loader.js"></script>
<script src="scripts/blog.js"></script>

</body>
</html>
