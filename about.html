  <title>The GADH: About</title>

  <style>
    /* ============================================
       VIDEO BLOCK — styled to match hero-content-inner
       and the underline-accent heading pattern used
       elsewhere on the page.
       ============================================ */
    .video-block {
      margin-top: 28px;
      padding-top: 24px;
      border-top: 1px solid rgba(42, 28, 13, 0.12);
    }

    .video-heading {
      font-family: "Roboto Condensed", sans-serif;
      font-weight: 700;
      font-size: 1.15em;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #a85a3e;
      margin: 0 0 16px;
    }

    .video-heading span {
      position: relative;
      padding-bottom: 4px;
    }

    .video-heading span::after {
      content: "";
      position: absolute;
      bottom: -2px;
      left: 0;
      width: 100%;
      height: 3px;
      background-color: #cb764e;
    }

    .video-frame {
      position: relative;
      padding: 56.25% 0 0 0; /* 16:9 */
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.22);
    }

    .video-frame iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    @media (max-width: 767px) {
      .video-heading { font-size: 1em; }
    }
  </style>
</head>

<body>

  <!-- ═══════════════════════════════════════════

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const theme_color = "dark";
      const color_main      = theme_color === "dark" ? "#000" : "#fff";
      const color_secondary = theme_color === "dark" ? "#fff" : "#000";

      const navbar = document.getElementById('main-navbar');
      if (!navbar) return;

      navbar.setTextColor(color_main);
      navbar.setSecondaryTextColor(color_main);
      navbar.setLanguageSelectorTextColor(color_secondary);
      navbar.setBottomBorderColor(color_main);

      navbar.addEventListener('languagechange', function (event) {
        const selectedLang = event.detail.language;
        if (typeof changeLanguage === 'function') changeLanguage(selectedLang);
      });

      const savedLanguage = localStorage.getItem('preferredLanguage');
      if (savedLanguage && navbar.setLanguage) navbar.setLanguage(savedLanguage);
      if (typeof initializeLanguage === 'function') initializeLanguage();
    });
  </script>
