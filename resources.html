<script>
document.addEventListener('DOMContentLoaded', () => {
    const languageFilter = document.getElementById('languageFilter');

    languageFilter.addEventListener('change', function() {
        const selectedLanguage = this.value;
        const imageItems = document.querySelectorAll('.image-item');

        imageItems.forEach(item => {
            const itemLanguages = item.getAttribute('data-language').split('&')
                .map(lang => lang.trim().toLowerCase());

            // Check if the item is tagged with 'all' or matches the selected language
            const isAllLanguage = itemLanguages.includes('all');
            const isMatchingLanguage = selectedLanguage === 'all' || 
                                       itemLanguages.includes(selectedLanguage);

            item.style.cssText = (isAllLanguage || isMatchingLanguage) ? '' : 'display: none !important;';
        });
        
        // Update counts after filtering
        updateResourceCounts();
    });
});
</script>

   // Style the navbar and set up event listeners for changing languages
document.addEventListener('DOMContentLoaded', function() {


  const theme_color = "dark" // Options: "dark", "light"
  const color_main = theme_color === "dark" ? "#000" : "#fff"
  const color_secondary = theme_color === "dark" ? "#fff" : "#000"
  
  

  // Get reference to the navbar component
  const navbar = document.getElementById('main-navbar');

  // Set text color for main navigation items
  navbar.setTextColor(color_main);

  // Set text color specifically for language dropdown items
  navbar.setLanguageSelectorTextColor(color_secondary);

  // Set bottom border color
  navbar.setBottomBorderColor(color_main);

  // Listen for language change events from the navbar
  navbar.addEventListener('languagechange', function(event) {
    const selectedLang = event.detail.language;
    
    // Call your existing language change function
    changeLanguage(selectedLang);
  });

  // Initialize the language from your page's system
  initializeLanguage();
});
    
  </script>
  
  <script>
    // Section navigation scroll tracking
    document.addEventListener('DOMContentLoaded', function() {
      const sections = document.querySelectorAll('section[id]');
      const navLinks = document.querySelectorAll('.section-nav a');
      
      // Intersection Observer for tracking active section
      const observerOptions = {
        rootMargin: '-20% 0px -70% 0px',
        threshold: 0
      };
      
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            const sectionId = entry.target.getAttribute('id');
            
            // Remove active class from all links
            navLinks.forEach(link => link.classList.remove('active'));
            
            // Add active class to current section link
            const activeLink = document.querySelector(`.section-nav a[data-section="${sectionId}"]`);
            if (activeLink) {
              activeLink.classList.add('active');
            }
          }
        });
      }, observerOptions);
      
      // Observe all sections
      sections.forEach(section => observer.observe(section));
      
      // Smooth scroll for nav links
      navLinks.forEach(link => {
        link.addEventListener('click', (e) => {
          e.preventDefault();
          const targetId = link.getAttribute('href').substring(1);
          const targetSection = document.getElementById(targetId);
          
          if (targetSection) {
            const navHeight = document.querySelector('.section-nav').offsetHeight;
            const headerHeight = document.querySelector('header').offsetHeight;
            const targetPosition = targetSection.offsetTop - navHeight - headerHeight - 20;
            
            window.scrollTo({
              top: targetPosition,
              behavior: 'smooth'
            });
          }
        });
      });
    });
    
    // Function to update resource counts
    function updateResourceCounts() {
      const sections = ['dashboards', 'guides', 'reports', 'gf', 'advocacy'];
      
      sections.forEach(sectionId => {
        const section = document.getElementById(sectionId);
        if (!section) return;
        
        const visibleItems = section.querySelectorAll('.image-item:not([style*="display: none"]):not(.archived-content .image-item)');
        const count = visibleItems.length;
        
        // Update section title count
        const sectionCount = document.getElementById(`section-count-${sectionId}`);
        if (sectionCount) {
          sectionCount.textContent = `(${count} resource${count !== 1 ? 's' : ''})`;
        }
      });
    }
    
    // Initialize counts on load
    document.addEventListener('DOMContentLoaded', function() {
      // Wait a bit for resources to load
      setTimeout(updateResourceCounts, 500);
    });
  </script>
