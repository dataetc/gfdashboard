<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" type="text/css" href="text/css_sitewide.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barriecito&family=Barrio&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <script src="scripts/js.js"></script>
  <title>The GADH: Post</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #f5f1eb;
      color: #1a1a1a;
      font-family: "Roboto Condensed", sans-serif;
    }

    /* ── HERO IMAGE ── */
    .post-hero {
      width: 100%;
      height: 62vh;
      min-height: 360px;
      max-height: 580px;
      position: relative;
      overflow: hidden;
      background: #1a1a1a;
      margin-top: 0; /* navbar sits above */
    }

    .post-hero img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      opacity: 0.7;
    }

    .post-hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.75) 0%, rgba(0,0,0,0.1) 60%);
    }

    .post-hero-meta {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 48px 6vw 40px;
      color: #fff;
    }

    .post-tag {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #cb764e;
      margin-bottom: 14px;
      border: 1px solid #cb764e;
      padding: 4px 12px;
    }

    .post-hero-meta h1 {
      font-family: 'Barrio', Arial, sans-serif;
      font-size: clamp(2rem, 4.5vw, 3.8rem);
      line-height: 1.08;
      font-weight: 400;
      max-width: 900px;
      margin-bottom: 16px;
    }

    .post-byline {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: rgba(255,255,255,0.65);
    }

    .post-byline .dot { color: #a85a3e; }

    /* ── BACK LINK ── */
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #a85a3e;
      text-decoration: none;
      padding: 22px 6vw;
      display: block;
      transition: gap 0.2s;
    }

    .back-link:hover { color: #cb764e; }

    /* ── ARTICLE BODY ── */
    .post-article {
      max-width: 820px;
      margin: 0 auto;
      padding: 0 6vw 100px;
    }

    .post-content {
      font-size: 1.1rem;
      line-height: 1.8;
      color: #2e2820;
      font-weight: 300;
    }

    .post-content p {
      margin-bottom: 1.5em;
    }

    .post-content h2 {
      font-family: 'Barrio', Arial, sans-serif;
      font-size: 1.9rem;
      font-weight: 400;
      color: #1a1a1a;
      margin: 2.5em 0 0.75em;
      line-height: 1.2;
    }

    .post-content h3 {
      font-family: 'Barrio', Arial, sans-serif;
      font-size: 1.4rem;
      font-weight: 400;
      color: #1a1a1a;
      margin: 2em 0 0.6em;
    }

    .post-content blockquote {
      border-left: 3px solid #a85a3e;
      padding: 16px 24px;
      margin: 2em 0;
      background: rgba(168,90,62,0.06);
      font-size: 1.05em;
      color: #5a5047;
      font-style: italic;
    }

    .post-content a {
      color: #a85a3e;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .post-content ul, .post-content ol {
      padding-left: 1.5em;
      margin-bottom: 1.5em;
    }

    .post-content li { margin-bottom: 0.5em; }

    /* ── TAGS ── */
    .post-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 56px;
      padding-top: 32px;
      border-top: 1px solid #e2ddd6;
    }

    .post-tags span {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #9e9088;
      padding: 5px 14px;
      border: 1px solid #e2ddd6;
    }

    /* ── MORE POSTS ── */
    .more-posts-section {
      background: #1a1a1a;
      padding: 72px 6vw;
      border-top: 3px solid #a85a3e;
    }

    .more-posts-section h2 {
      font-family: 'Barrio', Arial, sans-serif;
      font-size: 2rem;
      color: #fff;
      margin-bottom: 36px;
      font-weight: 400;
    }

    .more-posts-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      max-width: 1280px;
      margin: 0 auto;
    }

    @media (max-width: 900px) { .more-posts-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 560px) { .more-posts-grid { grid-template-columns: 1fr; } }

    .mini-card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      padding: 24px;
      text-decoration: none;
      color: #fff;
      display: block;
      transition: background 0.2s, transform 0.2s;
    }

    .mini-card:hover {
      background: rgba(255,255,255,0.1);
      transform: translateY(-3px);
    }

    .mini-card .mini-tag {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: #cb764e;
      margin-bottom: 10px;
      display: block;
    }

    .mini-card h3 {
      font-family: 'Barrio', Arial, sans-serif;
      font-size: 1.2rem;
      font-weight: 400;
      line-height: 1.3;
      margin-bottom: 10px;
    }

    .mini-card .mini-date {
      font-size: 0.72rem;
      color: rgba(255,255,255,0.4);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    /* ── FOOTER ── */
    .site-footer {
      background-color: #111;
      padding: 36px 6vw;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      border-top: 3px solid #a85a3e;
    }

    .site-footer .footer-brand {
      font-family: "Roboto Condensed", sans-serif;
      font-size: 0.85em;
      color: rgba(255,255,255,0.45);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .site-footer .footer-links {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }

    .site-footer .footer-links a {
      font-family: "Roboto Condensed", sans-serif;
      font-size: 0.85em;
      color: rgba(255,255,255,0.45);
      text-decoration: none;
      transition: color 0.2s;
      letter-spacing: 0.05em;
    }

    .site-footer .footer-links a:hover { color: #cb764e; }

    /* Loading / error */
    .post-error {
      text-align: center;
      padding: 120px 20px;
      font-family: 'Barrio', sans-serif;
      font-size: 2rem;
      color: #c9c0b4;
    }
  </style>
</head>
<body>

  <header>
    <script src="site-navbar.js"></script>
    <site-navbar id="main-navbar"></site-navbar>
  </header>

  <!-- HERO IMAGE -->
  <div class="post-hero" id="post-hero">
    <img id="hero-img" src="" alt="">
    <div class="post-hero-overlay"></div>
    <div class="post-hero-meta">
      <span class="post-tag" id="post-tag"></span>
      <h1 id="post-title">Loading…</h1>
      <div class="post-byline">
        <span id="post-author"></span>
        <span class="dot">·</span>
        <span id="post-date"></span>
      </div>
    </div>
  </div>

  <!-- BACK LINK -->
  <a href="blog.html" class="back-link">← Back to all posts</a>

  <!-- ARTICLE -->
  <article class="post-article">
    <div class="post-content" id="post-content"></div>
    <div class="post-tags" id="post-tags"></div>
  </article>

  <!-- MORE POSTS -->
  <section class="more-posts-section" id="more-posts-section" style="display:none">
    <div style="max-width:1280px;margin:0 auto;">
      <h2>More Posts</h2>
      <div class="more-posts-grid" id="more-posts-grid"></div>
    </div>
  </section>

  <footer class="site-footer">
    <span class="footer-brand">© 2025 The Global Advocacy Data Hub</span>
    <nav class="footer-links">
      <a href="/about.html">About</a>
      <a href="/resources.html">Resources</a>
      <a href="/blog.html">Blog</a>
      <a href="/support.html">Contact</a>
    </nav>
  </footer>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const navbar = document.getElementById('main-navbar');
      if (!navbar) return;
      navbar.setTextColor('#fff');
      navbar.setSecondaryTextColor('#fff');
      navbar.setLanguageSelectorTextColor('#fff');
      navbar.setBottomBorderColor('rgba(255,255,255,0.4)');
    });

    function getQueryParam(name) {
      return new URLSearchParams(window.location.search).get(name);
    }

    function formatDate(dateStr) {
      return new Date(dateStr).toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
    }

    // Convert plain-text post content to HTML paragraphs
    // Supports: ## Heading, ### Heading, > Blockquote, plain paragraphs
    function renderContent(text) {
      const lines = text.split('\n');
      let html = '';
      let i = 0;
      while (i < lines.length) {
        const line = lines[i].trim();
        if (!line) { i++; continue; }
        if (line.startsWith('## '))      html += `<h2>${line.slice(3)}</h2>`;
        else if (line.startsWith('### ')) html += `<h3>${line.slice(4)}</h3>`;
        else if (line.startsWith('> '))  html += `<blockquote>${line.slice(2)}</blockquote>`;
        else                             html += `<p>${line}</p>`;
        i++;
      }
      return html;
    }

    async function loadPost() {
      const postId = getQueryParam('id');
      if (!postId) { showError('No post specified.'); return; }

      try {
        const res = await fetch('posts/posts.json');
        if (!res.ok) throw new Error();
        const posts = await res.json();
        const post = posts.find(p => String(p.id) === String(postId));
        if (!post) { showError('Post not found.'); return; }

        // Set page title
        document.title = `The GADH: ${post.title}`;

        // Hero
        const heroImg = document.getElementById('hero-img');
        if (post.image) {
          heroImg.src = post.image;
          heroImg.alt = post.title;
        } else {
          document.getElementById('post-hero').style.display = 'none';
        }

        // Meta
        document.getElementById('post-title').textContent = post.title;
        document.getElementById('post-author').textContent = post.author || 'GADH Team';
        document.getElementById('post-date').textContent = formatDate(post.date);
        const tag = (post.tags && post.tags[0]) ? post.tags[0] : 'Update';
        document.getElementById('post-tag').textContent = tag;

        // Content
        document.getElementById('post-content').innerHTML = renderContent(post.content);

        // Tags
        if (post.tags && post.tags.length) {
          document.getElementById('post-tags').innerHTML =
            post.tags.map(t => `<span>${t}</span>`).join('');
        }

        // More posts (up to 3, excluding current)
        const others = posts.filter(p => String(p.id) !== String(postId))
                            .sort((a, b) => new Date(b.date) - new Date(a.date))
                            .slice(0, 3);
        if (others.length) {
          document.getElementById('more-posts-section').style.display = 'block';
          document.getElementById('more-posts-grid').innerHTML = others.map(p => `
            <a class="mini-card" href="blog-post.html?id=${p.id}">
              <span class="mini-tag">${(p.tags && p.tags[0]) || 'Update'}</span>
              <h3>${p.title}</h3>
              <span class="mini-date">${formatDate(p.date)}</span>
            </a>`).join('');
        }

      } catch(e) {
        showError('Could not load post.');
      }
    }

    function showError(msg) {
      document.body.innerHTML = `<div class="post-error">${msg}</div>`;
    }

    loadPost();
  </script>
</body>
</html>
